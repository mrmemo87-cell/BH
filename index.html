<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Heist: Tasks Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #071020;
            --panel: #0E1A2D;
            --glass: rgba(14, 26, 45, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-cyan: #00f6ff;
            --neon-pink: #ff00ff;
            --neon-lime: #a8ff00;
            --neon-purple: #a450ff;
            --neon-yellow: #f9f871;
            --neon-orange: #ff9a00;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-text {
            text-shadow:
                0 0 5px var(--neon-cyan),
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan);
        }
        
        .neon-text-pink {
            text-shadow:
                0 0 5px var(--neon-pink),
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink);
        }
        .neon-text-lime {
            text-shadow:
                0 0 5px var(--neon-lime),
                0 0 10px var(--neon-lime),
                0 0 20px var(--neon-lime);
        }
        .neon-text-purple {
            text-shadow:
                0 0 5px var(--neon-purple),
                0 0 10px var(--neon-purple),
                0 0 20px var(--neon-purple);
        }

        .neon-shadow-cyan {
            box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan);
        }
        
        .neon-shadow-yellow {
             box-shadow: 0 0 5px var(--neon-yellow), 0 0 10px var(--neon-yellow);
        }

        .btn-neon {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-pink);
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "firebase/": "https://aistudiocdn.com/firebase@^12.4.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <audio id="background-music" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2021/04/And-So-It-Begins-Inspired-By-Crush-Sometimes.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
